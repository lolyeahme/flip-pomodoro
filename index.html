<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlipPomodoro">
<meta name="description" content="纯黑底白字翻页番茄钟，完全离线运行。">
<title>FlipPomodoro · 翻页专注</title>
<style>
/* ============ FlipClock.js 0.10.8 官方样式（MIT，已内联） ============ */
.flip-clock {
  font-family: "Helvetica Neue", Helvetica, sans-serif;
  font-size: 16px;
  -webkit-user-select: none;
  text-align: center;
  position: relative;
  width: 100%;
  display: inline-flex;
  font-size: 1vw;
  font-family: "Helvetica Neue", Helvetica, sans-serif;
  box-sizing: border-box;
  align-items: flex-end; }
  .flip-clock .flip-clock-group {
    display: flex;
    position: relative; }
    .flip-clock .flip-clock-group .flip-clock-label {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      font-size: 1em;
      height: 2em;
      line-height: 2em;
      font-weight: 400;
      text-transform: capitalize;
      transform: translateY(-100%); }
      .flip-clock .flip-clock-group .flip-clock-label.flip-clock-meridium {
        font-size: 1.75em;
        line-height: 1.75em;
        top: 50%;
        left: 100%;
        flex: 0;
        width: auto;
        text-transform: uppercase;
        font-weight: 200;
        transform: translate(0.5em, -50%); }
    .flip-clock .flip-clock-group .flip-clock-list {
      width: 4em;
      height: 6em;
      position: relative;
      border-radius: .75rem;
      box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.24), 0 3px 8px rgba(0, 0, 0, 0.05);
      font-weight: bold;
      color: #ccc; }
      .flip-clock .flip-clock-group .flip-clock-list:not(:last-child) {
        margin-right: .333em; }
      .flip-clock .flip-clock-group .flip-clock-list:not(.flip) .active .flip-clock-list-item-inner {
        z-index: 4; }
      .flip-clock .flip-clock-group .flip-clock-list:not(.flip) .flip-clock-list-item-inner .top:after,
      .flip-clock .flip-clock-group .flip-clock-list:not(.flip) .flip-clock-list-item-inner .bottom:after {
        display: none; }
      .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner {
        position: absolute;
        width: 100%;
        height: 100%; }
      .flip-clock .flip-clock-group .flip-clock-list.flip {
        animation-delay: 500ms;
        animation-duration: 500ms; }
        .flip-clock .flip-clock-group .flip-clock-list.flip .flip-clock-list-item-inner {
          perspective: 15em; }
        .flip-clock .flip-clock-group .flip-clock-list.flip .top,
        .flip-clock .flip-clock-group .flip-clock-list.flip .bottom,
        .flip-clock .flip-clock-group .flip-clock-list.flip .active,
        .flip-clock .flip-clock-group .flip-clock-list.flip .active > div,
        .flip-clock .flip-clock-group .flip-clock-list.flip .before,
        .flip-clock .flip-clock-group .flip-clock-list.flip .before > div {
          animation-delay: inherit;
          animation-fill-mode: forwards;
          animation-duration: inherit;
          animation-timing-function: ease-in; }
          .flip-clock .flip-clock-group .flip-clock-list.flip .top:after,
          .flip-clock .flip-clock-group .flip-clock-list.flip .bottom:after,
          .flip-clock .flip-clock-group .flip-clock-list.flip .active:after,
          .flip-clock .flip-clock-group .flip-clock-list.flip .active > div:after,
          .flip-clock .flip-clock-group .flip-clock-list.flip .before:after,
          .flip-clock .flip-clock-group .flip-clock-list.flip .before > div:after {
            animation-duration: inherit;
            animation-fill-mode: inherit;
            animation-timing-function: inherit; }
        .flip-clock .flip-clock-group .flip-clock-list.flip .before {
          animation-delay: 0s; }
          .flip-clock .flip-clock-group .flip-clock-list.flip .before .top {
            animation-name: flip-top; }
          .flip-clock .flip-clock-group .flip-clock-list.flip .before .top:after,
          .flip-clock .flip-clock-group .flip-clock-list.flip .before .bottom:after {
            animation-name: show-shadow; }
        .flip-clock .flip-clock-group .flip-clock-list.flip .active > div {
          animation-name: indexing; }
        .flip-clock .flip-clock-group .flip-clock-list.flip .active .top:after,
        .flip-clock .flip-clock-group .flip-clock-list.flip .active .bottom:after {
          animation-delay: calc(500ms * .15);
          animation-name: hide-shadow; }
        .flip-clock .flip-clock-group .flip-clock-list.flip .active .bottom {
          animation-name: flip-bottom; }
      .flip-clock .flip-clock-group .flip-clock-list .active {
        z-index: 2; }
        .flip-clock .flip-clock-group .flip-clock-list .active .bottom {
          z-index: 2;
          transform-origin: top center; }
      .flip-clock .flip-clock-group .flip-clock-list .before {
        z-index: 3; }
        .flip-clock .flip-clock-group .flip-clock-list .before .top {
          z-index: 2;
          transform-origin: bottom center; }
          .flip-clock .flip-clock-group .flip-clock-list .before .top:after {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1) 0%, black 100%); }
        .flip-clock .flip-clock-group .flip-clock-list .before .bottom:after {
          background: linear-gradient(to bottom, black 0%, rgba(0, 0, 0, 0.1) 100%); }
      .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner {
        position: absolute;
        width: 100%;
        height: 100%;
        transform: rotateX(0.0001deg); }
        .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner:first-child {
          z-index: 2; }
        .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner > .top,
        .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner > .bottom {
          width: 100%;
          height: 50%;
          overflow: hidden;
          position: relative;
          font-size: 4.5em;
          background: #333;
          box-shadow: inset 0 0 0.2em rgba(0, 0, 0, 0.5); }
          .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner > .top:after,
          .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner > .bottom:after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            overflow: hidden; }
          .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner > .top:before,
          .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner > .bottom:before {
            content: " ";
            display: block;
            width: 100%;
            height: 1px;
            position: absolute; }
        .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner .top {
          border-radius: .75rem .75rem 0 0;
          line-height: 1.33333; }
          .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner .top:after {
            border-radius: .75rem .75rem 0 0; }
          .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner .top:before {
            background: #333;
            opacity: .4;
            bottom: 0; }
        .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner .bottom {
          border-radius: 0 0 .75rem .75rem;
          line-height: 0; }
          .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner .bottom:after {
            border-radius: 0 0 .75rem .75rem; }
          .flip-clock .flip-clock-group .flip-clock-list .flip-clock-list-item-inner .bottom:before {
            background: #ccc;
            opacity: .1; }
  .flip-clock .flip-clock-divider {
    position: relative;
    width: 1.5em;
    height: 6em; }
    .flip-clock .flip-clock-divider:before, .flip-clock .flip-clock-divider:after {
      content: " ";
      display: block;
      width: .75em;
      height: .75em;
      background: #333;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%; }
    .flip-clock .flip-clock-divider:before {
      transform: translate(-50%, 75%); }
    .flip-clock .flip-clock-divider:after {
      transform: translate(-50%, -175%); }

@keyframes indexing {
  0% {
    z-index: 2; }
  1% {
    z-index: 3; }
  100% {
    z-index: 4; } }

@keyframes flip-bottom {
  0% {
    transform: rotateX(90deg); }
  100% {
    transform: rotateX(0); } }

@keyframes flip-top {
  0% {
    transform: rotateX(0); }
  100% {
    transform: rotateX(-90deg); } }

@keyframes show-shadow {
  0% {
    opacity: 0; }
  100% {
    opacity: 1; } }

@keyframes hide-shadow {
  0% {
    opacity: 1; }
  100% {
    opacity: 0; } }


/* ============ 应用主题：纯黑底 / 白字 ============ */
:root{
  --bg:#000;
  --fg:#fff;
  --muted:#8c8c8c;
  --dim:#5a5a5a;
  --line:#1e1e1e;
  --card:#0a0a0a;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overflow-x:hidden;
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
::selection{background:#fff;color:#000}

/* 屏幕切换 */
.screen{
  position:fixed;inset:0;display:none;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
}
.screen.active{display:flex}

/* ---------- 设置页 ---------- */
#screen-setup{overflow-y:auto;align-items:center;justify-content:flex-start;padding-top:calc(28px + env(safe-area-inset-top))}
.setup-inner{width:100%;max-width:560px;margin:auto 0;padding:8px 0 28px}
.brand{display:flex;align-items:baseline;gap:12px;margin:0 0 26px}
.brand h1{font-size:26px;letter-spacing:.28em;font-weight:600;margin:0;text-transform:uppercase}

.field{margin-bottom:20px}
.field > label{display:block;font-size:12px;letter-spacing:.16em;color:var(--muted);margin-bottom:8px}
.text-input,.num-input{
  width:100%;background:#050505;border:1px solid var(--line);border-radius:10px;
  padding:13px 14px;font-size:15px;outline:none;transition:border-color .18s, box-shadow .18s;
}
.text-input::placeholder{color:#3f3f3f}
.text-input:focus,.num-input:focus{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.text-input.invalid{border-color:#fff;box-shadow:0 0 0 1px #fff}
.err{display:none;font-size:12px;color:#fff;margin-top:7px;letter-spacing:.06em}
.err.show{display:block}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:11px 0;font-size:13px;letter-spacing:.14em;color:var(--muted);transition:.18s}
.seg button.on{background:#fff;color:#000;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 16px;border:1px solid var(--line);border-radius:999px;font-size:13px;
  color:#cfcfcf;transition:.18s;letter-spacing:.04em;
}
.chip:hover{border-color:#555}
.chip.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
.inline-num{display:flex;align-items:center;gap:8px;margin-top:10px}
.inline-num label{font-size:12px;color:var(--dim);letter-spacing:.08em;white-space:nowrap}
.num-input{padding:8px 10px;font-size:13px;width:92px;border-radius:8px;text-align:center}
.unit{font-size:12px;color:var(--dim)}

.stepper{display:flex;align-items:center;gap:14px}
.stepper button{
  width:38px;height:38px;border:1px solid var(--line);border-radius:50%;
  font-size:18px;line-height:1;color:#ddd;transition:.18s;
}
.stepper button:hover{border-color:#fff;color:#fff}
.stepper .val{font-size:20px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.stepper .hint{font-size:12px;color:var(--dim);margin-left:2px;letter-spacing:.06em}

.eta{display:flex;align-items:baseline;gap:12px}
.eta-time{font-size:26px;letter-spacing:.06em;color:#fff;font-variant-numeric:tabular-nums}
.eta-note{font-size:12px;color:var(--dim);letter-spacing:.08em}
#eta-field{display:none}

.quote-preview{
  border:1px solid var(--line);border-radius:12px;background:#050505;
  padding:14px 16px;margin:24px 0 22px;
  display:flex;align-items:center;gap:14px;
}
.quote-preview .q{flex:1 1 auto;font-size:14px;line-height:1.8;color:#e6e6e6;letter-spacing:.04em}
.quote-preview .meta{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center}
.ghost-mini{font-size:11px;color:var(--dim);letter-spacing:.1em;border-bottom:1px solid #2a2a2a;padding-bottom:2px}
.ghost-mini:hover{color:#fff;border-color:#fff}

.btn-primary{
  width:100%;padding:15px;border-radius:12px;background:#fff;color:#000;
  font-size:14px;letter-spacing:.3em;font-weight:600;transition:.18s;
}
.btn-primary:hover{background:#d8d8d8}
.btn-primary:active{transform:translateY(1px)}

/* ---------- 运行页 ---------- */
#screen-run{justify-content:space-between}
.run-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.task-name{font-size:14px;letter-spacing:.12em;color:#e2e2e2;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-meta{font-size:12px;letter-spacing:.14em;color:var(--dim);text-align:right;white-space:nowrap}
.run-meta .phase{color:var(--muted)}

.clock-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:10px 8px}
#clock-wrap{width:100%;display:flex;align-items:center;justify-content:center;min-height:0;transition:opacity .3s;--emW:21.86}
#clock-wrap.paused{opacity:.22}
.pause-flag{height:22px;font-size:12px;letter-spacing:.4em;color:#6f6f6f;margin-top:16px}
#clock .flip-clock{width:auto;display:inline-flex;margin:0;flex:0 0 auto;max-width:none;
  /* 彻底覆盖 FlipClock 内置的 font-size:1vw，改为由 --emW 驱动的大字号 */
  font-size:min(calc((100vw - 40px) / var(--emW, 21.86)), calc(52vh / 6)) !important;
}

/* 黑底白字：覆盖 FlipClock 默认 #333/#ccc */
#clock .flip-clock .flip-clock-list{
  background:#0a0a0a;color:#fff;box-shadow:0 0 0 1px #141414, 0 10px 30px rgba(0,0,0,.9);
}
#clock .flip-clock .flip-clock-list-item-inner .top,
#clock .flip-clock .flip-clock-list-item-inner .bottom{background:#0a0a0a;color:#fff}
#clock .flip-clock .flip-clock-list .before .top:after{
  background:linear-gradient(to bottom, rgba(255,255,255,.10) 0%, rgba(0,0,0,.85) 100%);
}
#clock .flip-clock .flip-clock-list .before .bottom:after{
  background:linear-gradient(to bottom, rgba(0,0,0,.85) 0%, rgba(255,255,255,.10) 100%);
}
#clock .flip-clock .flip-clock-list:not(.flip) .flip-clock-list-item-inner:first-child{z-index:2}
#clock .flip-clock .flip-clock-divider:before,
#clock .flip-clock .flip-clock-divider:after{background:#7d7d7d}

.run-quote{max-width:760px;margin:0 auto;text-align:center;padding:0 8px 10px}
.run-quote .q{font-size:clamp(13px,1.6vw,17px);line-height:1.9;color:#d8d8d8;letter-spacing:.06em;overflow-wrap:anywhere}

.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;opacity:.42;transition:opacity .35s}
.controls:hover,.controls:focus-within{opacity:1}
.controls button{
  border:1px solid #232323;border-radius:9px;padding:9px 16px;font-size:12px;
  letter-spacing:.12em;color:#c4c4c4;background:rgba(0,0,0,.6);transition:.18s;
}
.controls button:hover{border-color:#fff;color:#fff}
.controls button:disabled{opacity:.35;cursor:default}
.controls button:disabled:hover{border-color:#232323;color:#c4c4c4}
body.goal-mode #btn-pause,body.goal-mode #btn-skip{display:none}

/* ---------- 完成页 ---------- */
#screen-done{align-items:center;justify-content:center;text-align:center}
.done-inner{width:100%;max-width:520px}
.done-mark{font-size:12px;letter-spacing:.5em;color:var(--muted);margin-bottom:18px}
.done-title{font-size:30px;letter-spacing:.22em;margin:0 0 10px;font-weight:600}
.done-task{font-size:14px;color:var(--muted);letter-spacing:.08em;margin-bottom:34px}
.stats{display:flex;justify-content:center;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;margin-bottom:30px}
.stat{flex:1;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stat span{display:block;font-size:11px;color:var(--dim);letter-spacing:.18em;margin-top:6px}
.done-quote{font-size:13px;line-height:1.9;color:#bdbdbd;letter-spacing:.05em;margin-bottom:30px;white-space:pre-line}
.done-actions{display:flex;gap:10px}
.done-actions .btn-primary{flex:1;letter-spacing:.16em}
.btn-secondary{
  flex:1;padding:15px;border-radius:12px;border:1px solid #262626;color:#bbb;
  font-size:14px;letter-spacing:.16em;transition:.18s;
}
.btn-secondary:hover{border-color:#fff;color:#fff}

/* 提示条 */
#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:#fff;color:#000;font-size:12px;letter-spacing:.08em;padding:10px 16px;border-radius:8px;
  opacity:0;pointer-events:none;transition:.28s;z-index:99;max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:520px){
  .brand h1{font-size:22px}
  .run-quote .q{font-size:12px}
  .controls button{padding:8px 12px;font-size:11px}
  #screen-run{padding-left:12px;padding-right:12px}
}
@media (max-height:520px){
  .run-quote{display:none}
  .pause-flag{height:14px}
}
</style>
</head>
<body>

<!-- ================= 设置页 ================= -->
<section id="screen-setup" class="screen active">
  <div class="setup-inner">
    <div class="brand"><h1>FlipPomodoro</h1></div>

    <div class="field">
      <label for="task-name">任务名称（必填）</label>
      <input id="task-name" class="text-input" type="text" maxlength="40" placeholder="例如：撰写论文 3.2 节" autocomplete="off">
      <div class="err" id="task-err">请先填写任务名称</div>
    </div>

    <div class="field">
      <label>模式</label>
      <div class="seg" id="mode-seg">
        <button type="button" data-mode="pomodoro" class="on">番茄专注</button>
        <button type="button" data-mode="goal">目标日期</button>
      </div>
    </div>

    <div id="pomodoro-fields">
      <div class="field">
        <label>专注时长</label>
        <div class="chips" id="dur-chips">
          <button type="button" class="chip" data-min="15">15 分钟</button>
          <button type="button" class="chip on" data-min="25">25 分钟</button>
          <button type="button" class="chip" data-min="45">45 分钟</button>
          <button type="button" class="chip" data-min="60">60 分钟</button>
        </div>
        <div class="inline-num">
          <label for="dur-custom">自定义</label>
          <input id="dur-custom" class="num-input" type="number" min="1" max="180" step="1" placeholder="25">
          <span class="unit">分钟（1–180）</span>
        </div>
      </div>

      <div class="field">
        <label>每轮之间休息</label>
        <div class="chips" id="break-chips">
          <button type="button" class="chip" data-min="0">不休息</button>
          <button type="button" class="chip" data-min="3">3 分钟</button>
          <button type="button" class="chip on" data-min="5">5 分钟</button>
          <button type="button" class="chip" data-min="10">10 分钟</button>
        </div>
        <div class="inline-num">
          <label for="break-custom">自定义</label>
          <input id="break-custom" class="num-input" type="number" min="0" max="60" step="1" placeholder="5">
          <span class="unit">分钟（0–60）</span>
        </div>
      </div>

      <div class="field">
        <label>循环次数</label>
        <div class="stepper">
          <button type="button" id="cyc-minus" aria-label="减少">−</button>
          <div class="val" id="cyc-val">4</div>
          <button type="button" id="cyc-plus" aria-label="增加">＋</button>
          <span class="hint">轮（1–12）</span>
        </div>
      </div>

      <div class="field" id="eta-field">
        <label>预计结束</label>
        <div class="eta">
          <span class="eta-time" id="eta-time">--:--</span>
          <span class="eta-note" id="eta-note"></span>
        </div>
      </div>
    </div>

    <div id="goal-fields" style="display:none">
      <div class="field">
        <label for="goal-date">目标日期时间</label>
        <input id="goal-date" class="text-input" type="datetime-local">
        <div class="err" id="goal-err">请选择一个未来的时间</div>
      </div>
    </div>

    <div class="quote-preview">
      <div class="q" id="quote-preview-text"></div>
      <div class="meta">
        <button type="button" class="ghost-mini" id="quote-next">换一句</button>
      </div>
    </div>

    <button type="button" class="btn-primary" id="start-btn">开始专注</button>
  </div>
</section>

<!-- ================= 运行页（专注 / 休息） ================= -->
<section id="screen-run" class="screen">
  <div class="run-top">
    <div class="task-name" id="run-task"></div>
    <div class="run-meta">
      <div class="phase" id="run-phase">专注</div>
      <div id="run-round"></div>
    </div>
  </div>

  <div class="clock-stage">
    <div id="clock-wrap"><div id="clock"></div></div>
    <div class="pause-flag" id="pause-flag"></div>
  </div>

  <div>
    <div class="run-quote">
      <div class="q" id="run-quote-text"></div>
    </div>
    <div class="controls">
      <button type="button" id="btn-pause">暂停</button>
      <button type="button" id="btn-skip">跳过</button>
      <button type="button" id="btn-full">全屏</button>
      <button type="button" id="btn-quit">退出</button>
    </div>
  </div>
</section>

<!-- ================= 完成页 ================= -->
<section id="screen-done" class="screen">
  <div class="done-inner">
    <div class="done-mark" id="done-mark">DONE</div>
    <h2 class="done-title" id="done-title">专注完成</h2>
    <p class="done-task" id="done-task"></p>
    <div class="stats">
      <div class="stat"><b id="stat-rounds">0</b><span>完成轮次</span></div>
      <div class="stat"><b id="stat-minutes">0</b><span>专注分钟</span></div>
    </div>
    <p class="done-quote" id="done-quote"></p>
    <div class="done-actions">
      <button type="button" class="btn-primary" id="again-btn">再专注一次</button>
      <button type="button" class="btn-secondary" id="back-btn">返回设置</button>
    </div>
  </div>
</section>

<div id="toast"></div>

  var QUOTES = ["千里之行，始于足下。","锲而不舍，金石可镂。","不积跬步，无以至千里。","宝剑锋从磨砺出，梅花香自苦寒来。","路漫漫其修远兮，吾将上下而求索。","长风破浪会有时，直挂云帆济沧海。","会当凌绝顶，一览众山小。","山重水复疑无路，柳暗花明又一村。","天生我材必有用，千金散尽还复来。","业精于勤，荒于嬉；行成于思，毁于随。","读书破万卷，下笔如有神。","纸上得来终觉浅，绝知此事要躬行。","千磨万击还坚劲，任尔东西南北风。","少年易老学难成，一寸光阴不可轻。","黑发不知勤学早，白首方悔读书迟。","少壮不努力，老大徒伤悲。","莫等闲，白了少年头，空悲切。","志不立，天下无可成之事。","有志者，事竟成。","天行健，君子以自强不息。","一分耕耘，一分收获。","坚持就是胜利。","今天的努力，是明天的底气。","越努力，越幸运。","把平凡的事做到极致，就是不平凡。","所有的坚持，终将美好。","耐心和坚持，会把你带到想去的地方。","你只管努力，剩下的交给时间。","每一次专注，都在向目标靠近。","慢慢来，比较快。","完成比完美更重要。","水滴石穿，不是力量大，而是功夫深。","冰冻三尺，非一日之寒。","只要功夫深，铁杵磨成针。","不积小流，无以成江海。","行百里者半九十。","为者常成，行者常至。","积土而为山，积水而为海。","学如弓弩，才如箭镞。","操千曲而后晓声，观千剑而后识器。","博观而约取，厚积而薄发。","穷且益坚，不坠青云之志。","老骥伏枥，志在千里。","立志欲坚不欲锐，成功在久不在速。","心之所向，素履以往。","道阻且长，行则将至。","行而不辍，未来可期。","星光不问赶路人，时光不负有心人。","努力到无能为力，拼搏到感动自己。","你现在的坚持，藏着你未来的样子。","没有白走的路，每一步都算数。","今天多坚持一点，明天就多从容一点。","专注当下，就是最好的未来。","把大目标拆成小步骤，一步步走完。","每一次开始，都是最好的时机。","沉下心来，把一件事做透。"];

  var LS_KEY = 'flipfocus.settings.v1';

  /* ---------------- DOM ---------------- */
  var $ = function (id) { return document.getElementById(id); };
  var screens = {
    setup: $('screen-setup'),
    run: $('screen-run'),
    done: $('screen-done')
  };
  var taskInput = $('task-name'), taskErr = $('task-err');
  var modeSeg = $('mode-seg');
  var pomodoroFields = $('pomodoro-fields'), goalFields = $('goal-fields');
  var durChips = $('dur-chips'), breakChips = $('break-chips');
  var durCustom = $('dur-custom'), breakCustom = $('break-custom');
  var cycVal = $('cyc-val');
  var etaField = $('eta-field'), etaTime = $('eta-time'), etaNote = $('eta-note');
  var goalDate = $('goal-date'), goalErr = $('goal-err');
  var quotePreviewText = $('quote-preview-text');
  var runTask = $('run-task'), runPhase = $('run-phase'), runRound = $('run-round');
  var clockWrap = $('clock-wrap'), clockEl = $('clock'), pauseFlag = $('pause-flag');
  var runQuoteText = $('run-quote-text');
  var btnPause = $('btn-pause'), btnSkip = $('btn-skip'), btnFull = $('btn-full'), btnQuit = $('btn-quit');
  var statRounds = $('stat-rounds'), statMinutes = $('stat-minutes'), doneQuote = $('done-quote');
  var doneTask = $('done-task'), doneTitle = $('done-title'), doneMark = $('done-mark');
  var toastEl = $('toast');

  /* ---------------- 状态 ---------------- */
  var S = {
    mode: 'pomodoro',
    task: '',
    workMin: 25,
    breakMin: 5,
    cycles: 4,
    round: 1,
    phase: 'idle',          // idle | work | break | done
    groups: 2,              // 当前时钟的数字组数（2=分:秒, 3=时:分:秒, 4=天:时:分:秒）
    deadline: 0,
    remaining: 0,
    running: false,
    clock: null,
    completed: 0,           // 已完成轮次
    focusedMin: 0,
    quote: null,
    ticker: null,
    wakeLock: null
  };

  /* ---------------- 工具 ---------------- */
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var quoteBag = [];
  function nextQuote() {
    if (!quoteBag.length) {
      quoteBag = shuffle(QUOTES.map(function (_, i) { return i; }));
    }
    var idx = quoteBag.pop();
    return { text: QUOTES[idx] };
  }

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  function clampInt(v, min, max, fallback) {
    var n = parseInt(v, 10);
    if (isNaN(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function fmtClock(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return h > 0 ? h + ':' + pad(m) + ':' + pad(ss) : m + ':' + pad(ss);
  }

  /* ---------------- 预计结束时间 ---------------- */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function updateEta() {
    if (S.mode !== 'pomodoro') { etaField.style.display = 'none'; return; }
    etaField.style.display = 'block';
    var totalMin = S.workMin * S.cycles + S.breakMin * (S.cycles - 1);
    var endMs = Date.now() + totalMin * 60 * 1000;
    var d = new Date(endMs);
    etaTime.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    etaNote.textContent = '共 ' + totalMin + ' 分钟';
  }

  /* ---------------- 音频提示（WebAudio，无外部资源） ---------------- */
  var audioCtx = null;
  function beep(kind) {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var seq = kind === 'done' ? [660, 880, 1046] : [880, 1046];
      seq.forEach(function (freq, i) {
        var t0 = audioCtx.currentTime + i * 0.16;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + 0.15);
      });
    } catch (e) { /* 静音降级 */ }
  }

  /* ---------------- 屏幕切换 ---------------- */
  function show(name) {
    Object.keys(screens).forEach(function (k) {
      screens[k].classList.toggle('active', k === name);
    });
    document.body.classList.toggle('goal-mode', S.mode === 'goal' && name === 'run');
  }

  /* ---------------- 设置页交互 ---------------- */
  function setMode(mode) {
    S.mode = mode;
    Array.prototype.forEach.call(modeSeg.children, function (b) {
      b.classList.toggle('on', b.dataset.mode === mode);
    });
    pomodoroFields.style.display = mode === 'pomodoro' ? '' : 'none';
    goalFields.style.display = mode === 'goal' ? '' : 'none';
    $('start-btn').textContent = mode === 'goal' ? '开始倒数' : '开始专注';
    saveSettings();
    updateEta();
  }

  function bindChips(container, onPick) {
    container.addEventListener('click', function (e) {
      var btn = e.target.closest('.chip');
      if (!btn) return;
      Array.prototype.forEach.call(container.children, function (c) {
        c.classList.toggle('on', c === btn);
      });
      onPick(parseInt(btn.dataset.min, 10));
      saveSettings();
    });
  }
  bindChips(durChips, function (m) { S.workMin = m; durCustom.value = ''; updateEta(); });
  bindChips(breakChips, function (m) { S.breakMin = m; breakCustom.value = ''; updateEta(); });

  function setCycle(n) {
    S.cycles = Math.min(12, Math.max(1, n));
    cycVal.textContent = S.cycles;
    saveSettings();
    updateEta();
  }
  $('cyc-minus').addEventListener('click', function () { setCycle(S.cycles - 1); });
  $('cyc-plus').addEventListener('click', function () { setCycle(S.cycles + 1); });

  durCustom.addEventListener('input', function () {
    if (durCustom.value === '') return;
    S.workMin = clampInt(durCustom.value, 1, 180, S.workMin);
    Array.prototype.forEach.call(durChips.children, function (c) { c.classList.remove('on'); });
    saveSettings();
    updateEta();
  });
  durCustom.addEventListener('blur', function () {
    durCustom.value = S.workMin;
  });

  breakCustom.addEventListener('input', function () {
    if (breakCustom.value === '') return;
    S.breakMin = clampInt(breakCustom.value, 0, 60, S.breakMin);
    Array.prototype.forEach.call(breakChips.children, function (c) { c.classList.remove('on'); });
    saveSettings();
    updateEta();
  });
  breakCustom.addEventListener('blur', function () {
    breakCustom.value = S.breakMin;
  });

  modeSeg.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-mode]');
    if (btn) setMode(btn.dataset.mode);
  });

  taskInput.addEventListener('input', function () {
    taskInput.classList.remove('invalid');
    taskErr.classList.remove('show');
    saveSettings();
  });

  $('quote-next').addEventListener('click', function () {
    var q = nextQuote();
    quotePreviewText.textContent = q.text;
  });

  /* ---------------- 持久化 ---------------- */
  function saveSettings() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        mode: S.mode,
        task: taskInput.value,
        workMin: S.workMin,
        breakMin: S.breakMin,
        cycles: S.cycles,
        goal: goalDate.value
      }));
    } catch (e) {}
  }

  function loadSettings() {
    var raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (typeof d.task === 'string') taskInput.value = d.task;
      if (typeof d.workMin === 'number') S.workMin = clampInt(d.workMin, 1, 180, 25);
      if (typeof d.breakMin === 'number') S.breakMin = clampInt(d.breakMin, 0, 60, 5);
      if (typeof d.cycles === 'number') S.cycles = clampInt(d.cycles, 1, 12, 4);
      if (typeof d.goal === 'string') goalDate.value = d.goal;
      if (d.mode === 'goal' || d.mode === 'pomodoro') S.mode = d.mode;
    } catch (e) {}
  }

  function syncControlsFromState() {
    Array.prototype.forEach.call(durChips.children, function (c) {
      c.classList.toggle('on', parseInt(c.dataset.min, 10) === S.workMin);
    });
    if (!durChips.querySelector('.chip.on')) durCustom.value = S.workMin;

    Array.prototype.forEach.call(breakChips.children, function (c) {
      c.classList.toggle('on', parseInt(c.dataset.min, 10) === S.breakMin);
    });
    if (!breakChips.querySelector('.chip.on')) breakCustom.value = S.breakMin;

    cycVal.textContent = S.cycles;
  }

  /* ---------------- 翻页时钟 ---------------- */
  function mountClock(ms, fixedTarget) {
    clockEl.innerHTML = '';
    var left = fixedTarget ? fixedTarget - Date.now() : ms;
    var face, groups;
    if (fixedTarget) {
      // 目标日期：>24h 用 天:时:分:秒（4 组），否则 时:分:秒（3 组）
      face = left >= 86400000 ? 'DayCounter' : 'HourCounter';
      groups = left >= 86400000 ? 4 : 3;
    } else {
      // 番茄：99 分钟以内用“分:秒”（2 组），更久用“时:分:秒”（3 组）
      face = ms <= 99 * 60000 ? 'MinuteCounter' : 'HourCounter';
      groups = ms <= 99 * 60000 ? 2 : 3;
    }
    var target = fixedTarget ? new Date(fixedTarget) : new Date(Date.now() + ms);
    try {
      S.clock = new FlipClock(clockEl, target, {
        face: face,
        countdown: true,
        autoStart: true,
        showLabels: false
      });
    } catch (e) {
      // 极端降级：纯文本
      clockEl.textContent = fmtClock(left);
      clockEl.style.fontSize = '16vw';
      clockEl.style.fontVariantNumeric = 'tabular-nums';
      return;
    }
    S.groups = groups;
    fitClock(groups);
  }

  function fitClock(groups) {
    if (!groups) {
      groups = S.groups || (clockEl.querySelectorAll('.flip-clock-group').length || 2);
    }
    if (!groups || groups < 2) groups = 2;
    // 总 em 宽：每组两张卡（4em×2 + 0.333em 间距），组间分隔 1.5em
    var emW = groups * (2 * 4 + 0.333) + Math.max(0, groups - 1) * 1.5;
    // 把 --emW 设置在稳定的 #clock 容器上（不会被 FlipClock 重建），
    // 字号由 CSS 的 min() 实时计算，从开始到结束始终一致，不受 JS 时序影响。
    clockEl.style.setProperty('--emW', emW);
  }

  window.addEventListener('resize', function () {
    if (S.phase === 'work' || S.phase === 'break' || S.phase === 'goal') fitClock(S.groups);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      if (S.phase === 'work' || S.phase === 'break' || S.phase === 'goal') fitClock(S.groups);
    }, 250);
  });

  /* ---------------- 状态机 ---------------- */
  function enterRun() {
    show('run');
    runTask.textContent = S.task;
    updateHud();
  }

  function updateHud() {
    if (S.mode === 'goal') {
      runPhase.textContent = '目标倒数';
      runRound.textContent = goalDate.value ? goalDate.value.replace('T', ' ') : '';
      return;
    }
    runPhase.textContent = S.phase === 'break' ? '休息' : '专注';
    runRound.textContent = '第 ' + S.round + ' / ' + S.cycles + ' 轮';
  }

  function setQuote() {
    S.quote = nextQuote();
    runQuoteText.textContent = S.quote.text;
  }

  function startPhase(ms, fixedTarget) {
    S.phase = S.phase === 'break' ? 'break' : (S.mode === 'goal' ? 'goal' : 'work');
    S.remaining = ms;
    S.deadline = fixedTarget || (Date.now() + ms);
    S.running = true;
    clockWrap.classList.remove('paused');
    pauseFlag.textContent = '';
    btnPause.textContent = '暂停';
    mountClock(ms, fixedTarget);
    updateHud();
    startTicker();
  }

  function startTicker() {
    stopTicker();
    S.ticker = setInterval(function () {
      if (!S.running) return;
      var left = S.deadline - Date.now();
      S.remaining = Math.max(0, left);
      document.title = fmtClock(S.remaining) + ' · ' + (S.phase === 'break' ? '休息' : S.task);
      if (left <= 0) {
        stopTicker();
        S.running = false;
        finishPhase();
      }
    }, 200);
  }

  function stopTicker() {
    if (S.ticker) { clearInterval(S.ticker); S.ticker = null; }
  }

  function pause() {
    if (!S.running) return;
    S.running = false;
    S.remaining = Math.max(0, S.deadline - Date.now());
    if (S.clock) { try { S.clock.stop(); } catch (e) {} }
    clockWrap.classList.add('paused');
    pauseFlag.textContent = '已暂停';
    btnPause.textContent = '继续';
  }

  function resume() {
    if (S.running || S.phase === 'done') return;
    if (S.mode === 'goal') { /* 目标模式不支持暂停 */ return; }
    S.running = true;
    clockWrap.classList.remove('paused');
    pauseFlag.textContent = '';
    btnPause.textContent = '暂停';
    S.deadline = Date.now() + S.remaining;
    mountClock(S.remaining, null);
    startTicker();
  }

  function finishPhase() {
    var wasBreak = S.phase === 'break';
    var wasGoal = S.phase === 'goal';

    if (wasGoal) {
      beep('done');
      S.completed = 1;
      S.focusedMin = 0;
      showDone(true);
      return;
    }

    if (wasBreak) {
      beep();
      S.phase = 'work';
      S.round += 1;
      setQuote();
      startPhase(S.workMin * 60000, null);
      return;
    }

    // 工作轮结束
    S.completed += 1;
    S.focusedMin += S.workMin;

    if (S.completed >= S.cycles) {
      beep('done');
      showDone(false);
      return;
    }
    beep();
    if (S.breakMin > 0) {
      S.phase = 'break';
      runTask.textContent = S.task;
      startPhase(S.breakMin * 60000, null);
      updateHud();
      pauseFlag.textContent = '起身活动一下';
    } else {
      S.phase = 'work';
      S.round += 1;
      setQuote();
      startPhase(S.workMin * 60000, null);
    }
  }

  function showDone(isGoal) {
    stopTicker();
    releaseWakeLock();
    S.phase = 'done';
    document.title = 'FlipPomodoro · 翻页专注';
    statRounds.textContent = isGoal ? '—' : S.completed;
    statMinutes.textContent = isGoal ? '—' : S.focusedMin;
    document.querySelector('.stats').style.display = isGoal ? 'none' : 'flex';
    doneTask.textContent = isGoal
      ? S.task + '　·　' + (goalDate.value || '').replace('T', ' ')
      : S.task;
    doneTitle.textContent = isGoal ? '目标时间已到' : '专注完成';
    doneMark.textContent = isGoal ? 'TIME IS UP' : 'DONE';
    doneQuote.textContent = S.quote.text;
    show('done');
  }

  function quit() {
    if ((S.phase === 'work' || S.phase === 'break') && S.running) {
      if (!window.confirm('退出当前专注？本轮进度不会保存。')) return;
    }
    stopTicker();
    S.running = false;
    S.phase = 'idle';
    if (S.clock) { try { S.clock.stop(); } catch (e) {} }
    S.clock = null;
    clockEl.innerHTML = '';
    releaseWakeLock();
    document.title = 'FlipPomodoro · 翻页专注';
    show('setup');
    syncControlsFromState();
  }

  /* ---------------- 启动 ---------------- */
  function validate() {
    var ok = true;
    var name = taskInput.value.trim();
    if (!name) {
      taskInput.classList.add('invalid');
      taskErr.classList.add('show');
      taskInput.focus();
      ok = false;
    }
    if (S.mode === 'goal') {
      var t = goalDate.value ? new Date(goalDate.value).getTime() : NaN;
      if (isNaN(t) || t < Date.now() + 30000) {
        goalErr.classList.add('show');
        ok = false;
      } else {
        goalErr.classList.remove('show');
      }
    }
    if (!ok) toast('请检查必填项');
    return ok;
  }

  function start() {
    if (!validate()) return;
    S.task = taskInput.value.trim();
    S.completed = 0;
    S.focusedMin = 0;
    S.round = 1;
    setQuote();
    enterRun();
    requestWakeLock();
    requestFullscreenSoft();

    if (S.mode === 'goal') {
      var t = new Date(goalDate.value).getTime();
      S.phase = 'goal';
      S.running = true;
      S.deadline = t;
      S.remaining = Math.max(0, t - Date.now());
      mountClock(S.remaining, t);
      updateHud();
      startTicker();
    } else {
      S.phase = 'work';
      startPhase(S.workMin * 60000, null);
    }
  }

  $('start-btn').addEventListener('click', start);

  btnPause.addEventListener('click', function () {
    if (S.mode === 'goal') return;
    if (S.running) pause(); else resume();
  });

  btnSkip.addEventListener('click', function () {
    if (S.mode === 'goal') return;
    if (!window.confirm('跳过当前阶段？')) return;
    stopTicker();
    S.running = false;
    clockWrap.classList.remove('paused');
    pauseFlag.textContent = '';
    if (S.phase === 'break') {
      S.phase = 'work';
      S.round += 1;
      setQuote();
      startPhase(S.workMin * 60000, null);
    } else {
      // 跳过工作轮：不计入完成轮次
      if (S.round >= S.cycles) {
        showDone(false);
        return;
      }
      if (S.breakMin > 0) {
        S.phase = 'break';
        startPhase(S.breakMin * 60000, null);
        updateHud();
        pauseFlag.textContent = '起身活动一下';
      } else {
        S.phase = 'work';
        S.round += 1;
        setQuote();
        startPhase(S.workMin * 60000, null);
      }
    }
  });

  btnFull.addEventListener('click', toggleFullscreen);
  btnQuit.addEventListener('click', quit);

  $('again-btn').addEventListener('click', start);
  $('back-btn').addEventListener('click', function () {
    show('setup');
    syncControlsFromState();
  });

  /* ---------------- 全屏 ---------------- */
  function requestFullscreenSoft() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) {
      try {
        var p = fn.call(el);
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    }
  }

  function toggleFullscreen() {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!fn) { toast('当前浏览器不支持全屏，iOS 请“添加到主屏幕”'); return; }
    try {
      var p = fn.call(el);
      if (p && p.catch) p.catch(function () { toast('无法进入全屏'); });
    } catch (e) {
      toast('无法进入全屏');
    }
  }

  document.addEventListener('fullscreenchange', function () {
    btnFull.textContent = document.fullscreenElement ? '退出全屏' : '全屏';
  });

  /* ---------------- 屏幕常亮 ---------------- */
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      S.wakeLock = lock;
      lock.addEventListener('release', function () { S.wakeLock = null; });
    }).catch(function () {});
  }
  function releaseWakeLock() {
    if (S.wakeLock) { try { S.wakeLock.release(); } catch (e) {} S.wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.running && !S.wakeLock) requestWakeLock();
  });

  /* ---------------- 键盘 ---------------- */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.code === 'Space') {
      e.preventDefault();
      if (S.phase === 'work' || S.phase === 'break') { S.running ? pause() : resume(); }
    } else if (e.key === 'f' || e.key === 'F') {
      toggleFullscreen();
    } else if (e.key === 'Escape' && screens.run.classList.contains('active')) {
      // 浏览器先处理全屏退出，这里不拦截
    }
  });

  window.addEventListener('beforeunload', function (e) {
    if (S.running && (S.phase === 'work' || S.phase === 'break')) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /* ---------------- URL 参数（便于 kiosk / 自测） ---------------- */
  function applyParams() {
    var p = new URLSearchParams(location.search);
    if (p.get('task')) taskInput.value = p.get('task');
    var mins = parseInt(p.get('mins'), 10);
    if (mins >= 1 && mins <= 180) { S.workMin = mins; }
    var brk = parseInt(p.get('break'), 10);
    if (brk >= 0 && brk <= 60) { S.breakMin = brk; }
    var rounds = parseInt(p.get('rounds'), 10);
    if (rounds >= 1 && rounds <= 12) { S.cycles = rounds; }
    if (p.get('mode') === 'goal') { S.mode = 'goal'; }
    if (p.get('goal')) { goalDate.value = p.get('goal'); }
  }

  /* ---------------- 初始化 ---------------- */
  loadSettings();
  applyParams();
  setMode(S.mode);
  syncControlsFromState();
  updateEta();
  setInterval(updateEta, 1000);
  S.quote = nextQuote();
  quotePreviewText.textContent = S.quote.text;
  if (!goalDate.value) {
    var d = new Date(Date.now() + 7 * 86400000);
    d.setHours(23, 59, 0, 0);
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    goalDate.value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // PWA manifest（运行时生成，保持单文件离线）
  try {
    var icon = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#000"/><rect x="86" y="166" width="150" height="180" rx="14" fill="none" stroke="#fff" stroke-width="10"/><rect x="276" y="166" width="150" height="180" rx="14" fill="none" stroke="#fff" stroke-width="10"/><text x="256" y="300" font-family="Helvetica,Arial" font-size="96" fill="#fff" text-anchor="middle">FF</text></svg>'
    );
    var mf = {
      name: 'FlipPomodoro 翻页专注',
      short_name: 'FlipPomodoro',
      start_url: location.pathname,
      display: 'standalone',
      orientation: 'any',
      background_color: '#000000',
      theme_color: '#000000',
      icons: [{ src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }]
    };
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(link);
  } catch (e) {}

  // 自测 / kiosk 自动启动
  if (new URLSearchParams(location.search).get('autostart') === '1') {
    if (!taskInput.value) taskInput.value = '专注测试';
    setTimeout(start, 300);
  }
})();
</script>
</body>
</html>
